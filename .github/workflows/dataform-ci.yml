name: lint-and-compile

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SQLFluff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install sqlfluff sqlfluff-templater-dbt
      - run: sqlfluff lint definitions/ --dialect bigquery

  compile:
    name: Dataform Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @dataform/cli@3.0.0
      - run: dataform compile
